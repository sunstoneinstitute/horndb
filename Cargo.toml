[workspace]
resolver = "2"
members = [
    "crates/simd",
    "crates/harness",
    "crates/storage",
    "crates/wcoj",
    "crates/owlrl",
    "crates/closure",
    "crates/incremental",
    "crates/sparql",
    "crates/ml",
    "crates/hardware-ext",
    "crates/bench-rdfox",
    "crates/metrics",
    "crates/bench-trainmarks",
    "crates/config",
]
# harness and bench-rdfox are excluded from default builds to avoid pulling in
# oxigraph → oxrocksdb-sys (~700 MB) during local development. Use --workspace
# in CI or pass -p horndb-harness explicitly to include them.
default-members = [
    "crates/simd",
    "crates/storage",
    "crates/wcoj",
    "crates/owlrl",
    "crates/closure",
    "crates/incremental",
    "crates/sparql",
    "crates/ml",
    "crates/hardware-ext",
    "crates/metrics",
    "crates/config",
]

[workspace.package]
# Single source of truth for every member crate's version (each crate sets
# `version.workspace = true`). Bumped and tagged `vX.Y.Z` by
# .claude/scripts/release.py (the `/release` command). `crates/python` is
# deliberately outside this workspace, so it keeps its own version.
version = "0.6.0"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
repository = "https://github.com/sunstoneinstitute/horndb"
authors = ["Sunstone Institute"]

[workspace.dependencies]
# Internal leaf crate (SPEC-12). Consumers reference it with
# `horndb-simd = { workspace = true }`.
horndb-simd = { path = "crates/simd" }
horndb-metrics = { path = "crates/metrics" }
horndb-config = { path = "crates/config" }
figment = { version = "0.10", features = ["toml", "env"] }
# SPEC-26 S3 live config reload: `notify` watches the base config file's
# directory and each `config.d` directory; `arc-swap` publishes the re-validated
# `ServerConfig` atomically so request handlers take a cheap per-request snapshot.
notify = "8"
arc-swap = "1"
prometheus-client = "0.25"
anyhow = "1"
thiserror = "2"
crossbeam-channel = "0.5"
rayon = "1"
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["html_reports"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pinned to 0.31: rusqlite 0.40 pulls libsqlite3-sys 0.38.0, whose build.rs
# uses the still-unstable `cfg_select!` macro and fails to build on any stable
# Rust (verified 1.88 / 1.90 / 1.93). Revert this pin once a fixed
# libsqlite3-sys (>0.38.0) ships. See the dependabot bump in git history.
rusqlite = { version = "0.31", features = ["bundled"] }
oxrdf = { version = "0.3", features = ["rdf-12"] }
# RFC 3986 IRI resolution (BASE-relative + prefixed-name expansion) for the
# ADD/MOVE/COPY SILENT-recovery prologue scan in horndb-sparql.
#
# Pinned exactly to the version spargebra 0.4.6 pulls in. It must match: we pass
# spargebra's `Iri<String>` straight into our own code, so two oxiri versions in
# the graph make that a type mismatch, not a coexistence. 0.3 also renamed
# `Iri::resolve` to take `&IriRef<_>` instead of `&str`. Dependabot bumped this
# to 0.3.1 in #286 and broke the build on main; `.github/dependabot.yml` now
# ignores it. Unpin once oxigraph/spargebra move to 0.3.
oxiri = "=0.2.11"
oxrdfio = { version = "0.2", features = ["rdf-12"] }
oxttl = { version = "0.2", features = ["rdf-12"] }
oxigraph = { version = "0.5", features = ["rdf-12"] }
sparesults = { version = "0.3", features = ["sparql-12"] }
quick-xml = { version = "0.41", features = ["serialize"] }
walkdir = "2"
sha2 = "0.11"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "serde", "macros"] }
serde_json = "1"
# Process-wide allocator for the shipped binaries (HDB-86 E1). Each binary
# crate sets the #[global_allocator] itself — a library cannot — behind a
# default-on `snmalloc` feature that doubles as the revert switch.
snmalloc-rs = "0.3"
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["yaml"] }
tempfile = "3"
arrow = { version = "59", default-features = false }
roaring = "0.11"
dashmap = "6"
parking_lot = "0.12"
bytemuck = { version = "1", features = ["derive"] }
spargebra = "0.4"
regex = "1"
axum = "0.8"
# `time` backs the SPEC-26 S5 per-query `query_timeout` timer in the SPARQL
# server (`crates/sparql/src/server/query.rs::arm_timeout`).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5"
hyper = "1"
pretty_assertions = "1"
# HDB-93 spike only (SPEC-25 S2 base-structure bench). Dev-dependencies of
# `horndb-storage`'s `dict_base_bench` example; never a library dependency.
# Remove with the example if S2 does not adopt the structure it picked.
ptr_hash = "2.1.1"
fst = "0.4.7"
memmap2 = "0.9.8"
hashbrown = "0.16.0"
bytes = "1"
http-body = "1"
pin-project-lite = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.bench]
inherits = "release"

# CI-only profile for the conformance harness (`cargo build --profile
# conformance`, used by .github/workflows/ci.yml). The Stage-1 conformance
# subset runs in seconds, so it does not need the bench-grade release profile
# above — thin LTO + codegen-units=1 + debug info across the ~500-crate
# harness dependency tree (oxigraph/rocksdb included) is what made the CI
# harness build take ~10 minutes. Light optimization keeps the run fast while
# compiling several times quicker. Never use this profile for numbers that go
# into docs/benchmarks.md.
[profile.conformance]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
debug = 0

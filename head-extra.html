<!-- Tab icons, for every page on the site. Beyond `website.favicon` in
     _quarto.yml, which takes only one file.

     hrefs must be root-absolute: Quarto depth-adjusts absolute hrefs here per
     page, but emits relative ones verbatim, which 404 on a nested page such as
     docs/ref/errors.html. -->
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" href="/assets/horndb-mark-square.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon-180.png">

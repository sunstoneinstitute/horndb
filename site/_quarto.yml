# Quarto site config for the horndb.io marketing homepage.
#
# This is a separate, small Quarto project from docs/ — not a subdirectory of
# it — so it gets its own navbar (just "Docs" + GitHub, no Guides/Reference/
# search/reader-toggle, none of which apply to a landing page) while still
# compiling from the exact same theme/ as docs/ (a duplicate of docs/theme/,
# kept in sync — see theme/theme.js for why it can't just be referenced from
# the other project). That shared compile is what keeps the navbar/footer/
# toggle from drifting the way a hand-maintained parallel HTML/CSS
# implementation did (see git history: site/index.html before this file).
#
# Rendered in CI by .github/workflows/pages.yml, mounted at horndb.io/
# alongside the docs/ pages at horndb.io/docs/. Build locally with
# `quarto render site`.

project:
  type: website
  output-dir: _site
  # theme/theme.js and theme/theme-toggle.css are loaded via a JS-constructed
  # href (see theme/pretheme.html), so Quarto's static resource scanner never
  # sees a literal reference to them — list them explicitly or they never
  # make it into _site/.
  resources:
    - "theme/theme.js"
    - "theme/theme-toggle.css"
  render:
    - "index.qmd"

website:
  title: "HornDB"
  site-url: "https://horndb.io/"
  description: "HornDB is a graph database for RDF, with a hybrid forward/backward-chaining reasoner for OWL 2 RL built in."
  favicon: assets/favicon.ico
  open-graph: true
  search: false
  navbar:
    background: "#0E1937"
    pinned: true
    title: false
    logo: assets/horndb-horizontal-dark.svg
    logo-alt: "HornDB"
    logo-href: index.qmd
    left: []
    right:
      - text: "Docs"
        href: /docs/
      - icon: github
        href: https://github.com/sunstoneinstitute/horndb
        aria-label: HornDB on GitHub
  page-footer:
    background: "#0E1937"
    left: "Built by [Sunstone Institute](https://sunstoneinstitute.ai) · Apache-2.0 · EU-developed, open from the start"
    right: "[github.com/sunstoneinstitute/horndb](https://github.com/sunstoneinstitute/horndb)"

format:
  html:
    theme:
      light: [cosmo, theme/horndb.scss]
      dark: [darkly, theme/horndb-dark.scss]
    # Unifies the toggle with the docs site — see theme/pretheme.html.
    # head-extra.html: icon links beyond the single `website.favicon` above.
    include-in-header:
      - theme/pretheme.html
      - head-extra.html
    css: styles.css
    page-layout: full
    toc: false
    smooth-scroll: true

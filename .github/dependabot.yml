version: 2
updates:
  # Keep GitHub Actions pinned-SHAs (and their `# vX.Y.Z` comments) current.
  # Actions are pinned to full commit SHAs in .github/workflows/ — Dependabot
  # bumps the SHA and rewrites the version comment when a new release lands.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep the Rust workspace dependencies current (root Cargo.toml / Cargo.lock).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    open-pull-requests-limit: 10
    ignore:
      # oxiri must stay on the exact version spargebra pulls in — two versions
      # in the graph is a type mismatch, not a coexistence. #286 bumped it to
      # 0.3.1 and broke the build. Drop this once oxigraph/spargebra move to 0.3.
      - dependency-name: "oxiri"
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

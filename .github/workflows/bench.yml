name: bench

# Manual escape hatch for running a benchmark script on the `hornbench`
# self-hosted runner. `ssh hornbench` is not reachable from every dev machine
# (and never from an agent session), so this workflow is the other way in:
# push a script on a branch, dispatch it here, download the artifact.
#
# It runs whatever repo-relative script you name — the workflow itself knows
# nothing about any particular bench. Conventions the script should follow:
#   - write everything it wants back into `bench-out/` (uploaded as an artifact)
#   - write a markdown table into `bench-out/SUMMARY.md` (appended to the job
#     summary, so the numbers are readable without downloading anything)
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Repo-relative path of the script to run (e.g. scripts/bench/audit-pass.sh)"
        required: true
        type: string
      args:
        description: "Arguments passed to the script (word-split, so quote nothing fancy)"
        required: false
        default: ""
        type: string
      env:
        description: "Extra environment, one KEY=VALUE per line"
        required: false
        default: ""
        type: string
  # `workflow_dispatch` only works once this file is on the default branch —
  # GitHub registers dispatchable workflows from `main`, so `gh workflow run
  # bench.yml --ref <branch>` 404s for a branch-only workflow. Pushing a branch
  # named `bench-run/<anything>` is the way in before that (and the way in for
  # anyone who has no dispatch permission): the push runs the branch's own
  # version of this file, with the input defaults below.
  push:
    branches: ["bench-run/**"]

# Serialize with nightly.yml and with other bench dispatches: hornbench has one
# set of cores and one page cache, and a measurement that shares them is noise.
# Never cancel a run in flight — a half-finished bench pass wastes an hour.
concurrency:
  group: hornbench
  cancel-in-progress: false

# Same persistent-disk conventions as nightly.yml: cargo downloads and the
# sccache object cache live outside the ephemeral checkout, which is wiped
# between runs. See nightly.yml for why this is preferred over a shared
# CARGO_TARGET_DIR or the GitHub-hosted cache.
env:
  SPB_ASSETS: /home/bench/src/horndb/crates/harness/data/ldbc-spb/dist
  # Deliberately NO HARNESS_DB here. nightly.yml points it at the cumulative
  # trend DB; an ad-hoc bench pass must not append to that series. Scripts set
  # their own (audit-pass.sh writes into its bench-out/ dir).
  CARGO_HOME: /home/bench/horndb-bench/cache/cargo-home
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"
  SCCACHE_DIR: /home/bench/horndb-bench/cache/sccache
  SCCACHE_CACHE_SIZE: 40G

jobs:
  bench:
    runs-on: [self-hosted, bench, zen4]
    # A full bench pass (release builds of several crates plus criterion runs
    # over 10M-triple corpora) legitimately takes a couple of hours. Past that
    # something is wedged, and it is holding the hornbench concurrency group.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.90.0"
          cache: false

      - name: run bench script
        env:
          # Via env, not inline `${{ }}`, so a dispatch input cannot be spliced
          # into the shell as code.
          # On a `bench-run/**` push there are no inputs, so fall back to the
          # full audit pass; a leg subset is then selected by editing BENCHES
          # in the script on that branch.
          BENCH_SCRIPT: ${{ inputs.script || 'scripts/bench/audit-pass.sh' }}
          BENCH_ARGS: ${{ inputs.args }}
          BENCH_ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail
          test -f "$BENCH_SCRIPT" || { echo "::error::no such script: $BENCH_SCRIPT"; exit 1; }
          mkdir -p bench-out
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            echo "env: $line"
            export "$line"
          done <<< "$BENCH_ENV"
          # shellcheck disable=SC2086  # word-splitting $BENCH_ARGS is the point
          bash "$BENCH_SCRIPT" $BENCH_ARGS

      - name: publish summary
        if: always()
        run: |
          if [ -f bench-out/SUMMARY.md ]; then
            cat bench-out/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no bench-out/SUMMARY.md produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: upload bench-out
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ github.run_id }}
          path: bench-out/
          if-no-files-found: warn

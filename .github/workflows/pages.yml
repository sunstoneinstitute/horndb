name: Deploy site to GitHub Pages

# Publishes horndb.io: the landing page (`index.qmd`) at the root and the docs
# (`docs/ref/`, `docs/guides/`, `docs/index.qmd`) under `/docs/` — one deploy,
# one host, no separate docs site. One Quarto project rooted at the repo root
# (`_quarto.yml`) renders both, so the navbar, footer, theme, and search index
# are shared by construction and cannot drift; the landing page trims the navbar
# items it does not want from its own page-scoped `theme/landing.css`. Runs on
# pushes to main that touch a rendered input, and can be triggered manually.
#
# Add any new top-level render input to `paths:` below, or edits to it will
# silently never deploy.

on:
  push:
    branches: [main]
    paths:
      - "index.qmd"
      - "docs/index.qmd"
      - "docs/ref/**"
      - "docs/guides/**"
      - "theme/**"
      - "assets/**"
      - "_quarto.yml"
      - "head-extra.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The getting-started guide (docs/guides/getting-started.qmd) executes
      # against a real `serve` binary, so it needs an actual build — Quarto
      # captures the real HTTP response rather than a hand-typed example.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.90.0"
      - run: cargo build -p horndb-sparql --bin serve

      # `.qmd` pages with `jupyter: python3` front matter need a registered
      # "python3" Jupyter kernel to execute their cells.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python -m venv docs/.venv
          docs/.venv/bin/pip install jupyter ipykernel
          docs/.venv/bin/python -m ipykernel install --user --name python3
          echo "$PWD/docs/.venv/bin" >> "$GITHUB_PATH"

      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: "1.9.38"
      # One render covers the landing page and the docs, and emits one
      # robots.txt and one sitemap.xml at the site root — no artifact merge,
      # and no hand-appended second sitemap for crawlers to find.
      - run: quarto render

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

name: Deploy site to GitHub Pages

# Publishes horndb.io: the marketing homepage (`site/`) at the root, and the
# docs (`docs/ref/`, `docs/guides/`, `docs/index.qmd`) under `/docs/` — one
# deploy, one host, no separate docs site. Both are their own small Quarto
# projects (separate `_quarto.yml`s, separate navbars) compiled from the same
# shared theme (`docs/theme/` and its byte-identical duplicate `site/theme/` —
# see the header comment in docs/theme/theme.js), which is what keeps the
# navbar/footer/toggle chrome from drifting between the two. The two projects
# are rendered independently, then merged into a single artifact directory
# before upload. Runs on pushes to main that touch either tree, and can be
# triggered manually.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/ref/**"
      - "docs/guides/**"
      - "docs/theme/**"
      - "docs/assets/**"
      - "docs/index.qmd"
      - "docs/_quarto.yml"
      - "docs/head-extra.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The getting-started guide (docs/guides/getting-started.qmd) executes
      # against a real `serve` binary, so it needs an actual build — Quarto
      # captures the real HTTP response rather than a hand-typed example.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.90.0"
      - run: cargo build -p horndb-sparql --bin serve

      # `.qmd` pages with `jupyter: python3` front matter need a registered
      # "python3" Jupyter kernel to execute their cells.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python -m venv docs/.venv
          docs/.venv/bin/pip install jupyter ipykernel
          docs/.venv/bin/python -m ipykernel install --user --name python3
          echo "$PWD/docs/.venv/bin" >> "$GITHUB_PATH"

      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: "1.9.38"
      - run: quarto render site
      - run: quarto render docs

      # Merge the two rendered projects into one artifact. Nothing collides —
      # each project's robots.txt / sitemap.xml / search.json / site_libs lands
      # in its own namespace. Crawlers only read robots.txt from the host root,
      # so the docs sitemap has to be advertised there or it is never seen.
      - run: |
          mkdir -p _pages_out
          cp -r site/_site/. _pages_out/
          cp -r docs/_site _pages_out/docs
          echo "Sitemap: https://horndb.io/docs/sitemap.xml" >> _pages_out/robots.txt

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _pages_out
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

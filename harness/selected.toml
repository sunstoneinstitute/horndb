    # only. CONSTRUCT graph results (`.ttl`, needing blank-node-isomorphic
    # graph comparison) and `.csv`/`.tsv` serialisations are not graded yet.
    "data-sparql11/construct/manifest#constructwhere01",
    "data-sparql11/construct/manifest#constructwhere02",
    "data-sparql11/construct/manifest#constructwhere03",
    "data-sparql11/construct/manifest#constructwhere04",

# SPEC-01 F11 — versioned manifest of which test IDs the harness expects
# to pass right now. CI runs ONLY what is listed here. Adding tests
# is a normal PR change; removing tests requires an entry in [[removed]]
# with a tracking issue URL.
#
# Stage-0 selection: one trivial test per suite, sufficient to prove
# that the harness flags the stub engine red when it should and green
# when it should. As Stage-1 work lands, the OWL 2 suite grows to >=50
# real W3C cases (see plans/PLAN-01-01-conformance-harness.md
# Stage 1).
#
# IDs are suffix-matched against the manifest entry IRI so the same
# selection survives any workspace root path (worktrees, CI checkouts).
#
# SPEC-10 `rdflib-compat` subset: the rdflib compatibility suite is a
# Python-side *differential* gate (HornDB vs upstream `rdflib`), not a
# manifest-driven Rust suite, so it does not appear as a `[suites.*]` entry
# here — those map 1:1 to Rust `Suite` keys in `crates/harness/src/runner.rs`
# with an RDF/SPARQL manifest. The rdflib-compat subset instead lives in
# `crates/python/tests/test_rdflib_compat.py` and is run by the dedicated
# `python-rdflib-compat` CI job (`.github/workflows/ci.yml`). Its curated case
# list and grading rules are documented in
# `harness/curation/rdflib-compat.md`. The harness-first rule still holds: that
# Python suite is the SPEC-10 gate and must stay green.

version = 1

[suites.owl2]
manifest = "crates/harness/tests/fixtures/owl2/manifest.ttl"
include = [
    # Stub passes this (empty graph entails empty graph).
    "#trivial-entail-true",
    # Stub fails this -- included on purpose so CI proves red-on-failure.
    "#subclass-entail",
    # Stub passes this (recognises explicit owl:Nothing membership).
    "#inconsistent-001",
    # Rule-coverage fixtures for the SPEC-04 Stage-1 OWL 2 RL engine.
    # Each name corresponds to the rules.toml id whose body+head it
    # exercises in isolation. The aspirational ≥50-case W3C subset
    # (see harness/curation/owl2-rl-50.md) ships in a follow-up once
    # the W3C OWL 2 test suite is fetched and its embedded-ontology
    # manifest format is wired through the harness.
    "#scm-sco-transitive",
    "#scm-spo-transitive",
    "#eq-sym",
    "#eq-trans",
    "#prp-symp",
    "#prp-trp",
    "#prp-inv1",
    "#prp-inv2",
    "#prp-spo1",
    "#prp-eqp1",
    "#prp-dom",
    "#prp-rng",
    "#cax-eqc1",
    "#cax-eqc2",
    # Exercises the negative-entailment path: premise without an
    # instance does not entail an instance-membership conclusion.
    "#negative-subclass-no-instance",
]

[suites.sparql11]
manifest = "crates/harness/tests/fixtures/sparql11/manifest.ttl"
include = [
    "#ask-true",
]

[suites.sparql11-syntax]
# W3C SPARQL 1.1 *syntax* tests (query + update), graded by `spargebra`
# accept/reject — no data, no result set, no reasoner. A curated checked-in
# subset of the upstream `syntax-query` / `syntax-update-{1,2}` sub-suites
# (https://www.w3.org/2009/sparql/docs/tests/); see
# `crates/harness/tests/fixtures/sparql11-syntax/`. These run in
# sub-milliseconds and need no network at CI time, so they fit the SPEC-01
# NF1 per-PR budget comfortably. Grow this list as the SPARQL frontend widens.
manifest = "crates/harness/tests/fixtures/sparql11-syntax/manifest.ttl"
include = [
    # positive query syntax
    "#syntax-select-01",
    "#syntax-bind-01",
    "#syntax-aggregate-01",
    "#syntax-subquery-01",
    "#syntax-propertypath-01",
    "#syntax-values-01",
    # relative IRIs with no BASE must resolve against the action file IRI
    "#syntax-relative-iri-01",
    # negative query syntax (grammar must reject)
    "#syntax-bad-01",
    "#syntax-bad-02",
    "#syntax-bad-03",
    # positive update syntax
    "#syntax-update-insertdata-01",
    "#syntax-update-deletewhere-01",
    "#syntax-update-modify-01",
    # negative update syntax (grammar must reject)
    "#syntax-update-bad-01",
    "#syntax-update-bad-02",
]

[suites.sparql11-eval]
# W3C SPARQL 1.1 *evaluation* suite — the whole upstream manifest tree
# (`mf:QueryEvaluationTest` + `mf:UpdateEvaluationTest`), read straight from
# the fetched corpus rather than from hand-mirrored fixtures. Run
# `crates/harness/scripts/fetch-w3c-suites.sh` first; the corpus lives under
# the gitignored `crates/harness/data/`. `fetched = true` records that: when
# the manifest is absent the suite reports Skipped (naming the fetch script)
# and the rest of the selection still grades, so a job that does not fetch —
# e.g. CI's `tests` job — is unaffected. Jobs that DO fetch (CI conformance,
# nightly) pass `harness run --require-corpus`, which turns the same missing
# manifest back into a hard error so this suite cannot silently vanish.
#
# `include = ["*"]` selects EVERY case in the tree. SPEC-00's harness-first
# rule forbids narrowing a suite to make a run look better, so a case that
# cannot pass today is listed in `expected_failures` below — still selected,
# still executed, reported as a Skip with its reason, and reported as a
# FAILURE the moment it starts passing (so the list cannot rot). The grouped
# root-cause triage is in `harness/KNOWN-MANIFEST-BUGS.md`.
manifest = "crates/harness/data/w3c-sparql11-tests/sparql11-test-suite/manifest-all.ttl"
fetched = true
include = ["*"]
expected_failures = [

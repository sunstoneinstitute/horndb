    # answers under simple entailment only; `sd:entailmentRegime` is not read.
    # 28 of the 66 entailment cases already pass because their answer does not
    # need the regime.
    "data-sparql11/entailment/manifest#paper-sparqldl-Q1",
    "data-sparql11/entailment/manifest#paper-sparqldl-Q1-rdfs",
    "data-sparql11/entailment/manifest#paper-sparqldl-Q2",
    "data-sparql11/entailment/manifest#paper-sparqldl-Q3",

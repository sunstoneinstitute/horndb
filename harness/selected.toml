    "data-sparql11/functions/manifest#bnode02",
    "data-sparql11/functions/manifest#encode01",
    "data-sparql11/functions/manifest#iri01",
    "data-sparql11/functions/manifest#md5-01",
    "data-sparql11/functions/manifest#md5-02",

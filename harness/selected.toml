# SPEC-07 Stage-1 SPARQL query subset.
#
# These fixtures live outside the W3C manifest model used by `[suites.*]`:
# each entry names a directory under
# `crates/harness/tests/fixtures/sparql11/<path>` containing
# `query.rq`, `form`, `expected.srj`, and its data as either `data.nt`
# (default graph only) or `data.trig` (named graphs). A dir may also carry
# a `default-graph` file naming the `default_graph` mode (SPEC-28 D2);
# without one the crate default (`union`) applies. They are consumed
# directly by `crates/sparql/tests/w3c_suite.rs`, not by the harness
# binary's manifest-driven runner — that runner has no result-set test
# kind, so this section is the repo's real query-evaluation gate. SPEC-01
# will subsume it into a uniform suite model once the SPARQL engine widens.
[sparql_query]
tests = [
    "selected_subset/basic-001",
    "selected_subset/basic-002",
    "selected_subset/basic-003",
    "selected_subset/basic-004",
    "selected_subset/basic-005",
    "selected_subset/expr-001",
    "selected_subset/expr-002",
    # Non-recursive property paths (SPEC-07 #49).
    "selected_subset/path-alt-001",
    "selected_subset/path-neg-001",
    "selected_subset/path-opt-001",
    # Recursive Kleene property paths (SPEC-07 #50): `+` transitive,
    # `*` reflexive-transitive (the acceptance #7 `subClassOf*` shape).
    "selected_subset/path-plus-001",
    "selected_subset/path-star-001",
    # W3C SPARQL 1.0 `graph/` family (SPEC-28 S7, #266) — `GRAPH <g>`,
    # `GRAPH ?g`, and the graph variable's join behaviour. Mirrored from

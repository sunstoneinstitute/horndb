    # bijection between the answer's and the expected result's blank nodes
    # (SPARQL 1.1 result-set isomorphism). `plus-1`/`plus-2` differ *only* in
    # a blank node's label (`_:b` vs `_:b0`) since HDB-131 fixed their numeric
    # typing; every other cell of every row matches.
    "data-sparql11/functions/manifest#plus-1",
    "data-sparql11/functions/manifest#plus-2",
    "data-sparql11/json-res/manifest#jsonres01",
    "data-sparql11/json-res/manifest#jsonres02",

    # Property-path evaluation: `pp16` returns 13 of the 15 expected rows.
    "data-sparql11/property-path/manifest#pp16",
]


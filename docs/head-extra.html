<!-- Tab icons for the docs pages. Without them the browser falls back to
     /favicon.ico, which 404s, and docs tabs show a blank icon.

     hrefs must be root-absolute and resolve against THIS project's root:
     Quarto depth-adjusts absolute hrefs here per page, but emits relative ones
     verbatim, which 404 on nested pages. Files are copies of site/assets/ —
     keep docs/assets/ byte-identical to it, icons and navbar logo alike. -->
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" href="/assets/horndb-mark-square.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon-180.png">

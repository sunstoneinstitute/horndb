[package]
name = "horndb-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "harness"
path = "src/bin/harness.rs"

[dependencies]
snmalloc-rs = { workspace = true, optional = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusqlite = { workspace = true }
oxrdf = { workspace = true }
oxsdatatypes = { workspace = true }
oxrdfio = { workspace = true }
oxttl = { workspace = true }
oxigraph = { workspace = true }
# SPARQL 1.1 syntax suite: grade positive/negative syntax cases by parse
# accept/reject with the same grammar the SPEC-07 engine uses. The
# `sep-0006`/`sparql-12` features match `horndb-sparql` so the harness and the
# engine accept exactly the same surface (see crates/sparql/Cargo.toml).
spargebra = { workspace = true, features = ["sep-0006", "sparql-12"] }
# SPARQL 1.1 *evaluation* suite (`sparql11-eval`): the harness runs the SPEC-07
# engine directly, the same way it grades syntax cases with `spargebra`
# directly. `default-features = false` keeps the HTTP server (axum/tokio) and
# the optional reasoner out of the harness binary — only the query/update
# execution path is needed.
# `server` is on for the `sparql11-gsp` suite (SPEC-28 S5): those cases are
# HTTP request/response pairs, so `crate::gsp` boots the real axum router on a
# bound port and drives it. It brings in axum/tokio/parking_lot but not the
# reasoner or the GraphBLAS-linked incremental backend.
horndb-sparql = { path = "../sparql", default-features = false, features = ["server"] }
axum = { workspace = true }
# `net` + `io-util` are for `gsp.rs`: it binds a listener and speaks HTTP/1.1
# over a raw socket. `rt-multi-thread` etc. come from the workspace entry.
tokio = { workspace = true, features = ["net", "io-util"] }
parking_lot = { workspace = true }
sparesults = { workspace = true }
quick-xml = { workspace = true }
walkdir = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
time = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[dependencies.horndb-owlrl]
path = "../owlrl"
optional = true

[features]
default = ["snmalloc"]
real-engine = ["dep:horndb-owlrl"]
# HDB-86 E1: snmalloc as the process-wide allocator for this crate's binary.
# Measured on the trainmarks bulk load (hornbench, xlarge): -10.6% on the
# `parse` phase, -6.3% end-to-end, because a cross-thread free no longer takes
# the owning arena's lock. Default-on; disabling it restores the system
# allocator and is the revert path.
snmalloc = ["dep:snmalloc-rs"]

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }

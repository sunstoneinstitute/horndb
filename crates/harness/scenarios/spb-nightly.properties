# LDBC SPB nightly scenario — SF=0.256 editorial + aggregation run.
#
# This is the checked-in source of truth for the `nightly` workflow's
# SPB run. The workflow copies it into the prepared SPB assets tree (the
# Ant `dist/` directory) before invoking the driver, because the relative
# path keys below (ontologiesPath, queriesPath, definitionsPath, …) are
# resolved by the driver against the scenario file's own directory.
#
# Phases: everything that loads or generates data is OFF — the store is
# pre-loaded out-of-band with the same flat N-Triples closure on every
# engine (HornDB: `serve` loads it; GraphDB and Oxigraph: bulk-loaded
# once). Only `warmUp` and `runBenchmark` are on, so the run measures
# query and update throughput against an identical corpus.
#
# Scale (HDB-37): `datasetSize=256000000` is the real number of Creative
# Work triples generated for the served corpus, so the nightly now runs
# the LDBC-defined SF=0.256 workload rather than the earlier ~512 k
# feasible-scale stand-in. The closure served is ~2.1x that (OWL 2 RL
# expansion), built in slices on hornbench — see
# `scripts/bench/spb-sf256-build.sh`.
#
# `editorialAgents=2` alongside `aggregationAgents=4`: with editorial
# (Creative Work insert/update/delete) agents running, the headline metric
# is `editorial-qps`, the LDBC-defined one. `aggregation-qps` is still
# recorded, but its series restarts here — the corpus is 512x bigger and
# the aggregation agents now share the store with writers, so numbers
# before and after this change are not comparable.
#
# `creativeWorksPath` must point at the generation run that produced the
# served closure: the driver reads `dataset.info` from it (so editorial
# INSERTs mint Creative Work ids that do not collide with the corpus) and
# the `query<N>SubstParameters.txt` files (the constants the aggregation
# queries are parameterised with, which must name entities that exist in
# this corpus). On hornbench `./generated-sf256` is a symlink into the
# persistent build directory.
#
# `endpointURL` / `endpointUpdateURL` / `benchmarkRunPeriodSeconds` are
# overridden by the harness shim (`--endpoint` / `--endpoint-update` /
# `--duration`); the values here are only sane standalone defaults.

#Benchmark Threads Configuration
aggregationAgents=4
editorialAgents=2
dataGeneratorWorkers=4

#Benchmark Configuration Parameters
warmupPeriodSeconds=60
benchmarkRunPeriodSeconds=600
datasetSize=256000000
generatedTriplesPerFile=50000
# 60 s was enough for the 512 k stand-in corpus. At SF=0.256 a cold
# aggregation query legitimately runs longer than that, and a timeout is
# scored as an error, so the upstream default is used instead.
queryTimeoutSeconds=300
querySubstitutionParameters=20000
benchmarkByQueryMixRuns=0
minUpdateRateThresholdOps=0.0
minUpdateRateThresholdReachTimePercent=0
maxUpdateRateThresholdOps=0.0
endpointURL=http://127.0.0.1:3840/query
endpointUpdateURL=http://127.0.0.1:3840/update
ontologiesPath=./data/ontologies
referenceDatasetsPath=./data/datasets
creativeWorksPath=./generated-sf256
queriesPath=./data/sparql
validationPath=./data/validation
definitionsPath=./definitions.properties
scriptsPath=./data/scripts
enableCompressionOnGeneratedData=false
creativeWorksInfo=dataset.info
generateCreativeWorksFormat=n-triples
currentRateReportPeriodSeconds=0
saveDetailedQueryLogs=true
verbose=true

#Benchmark Operational Phases
loadOntologies=false
loadReferenceDatasets=false
generateCreativeWorks=false
loadCreativeWorks=false
generateQuerySubstitutionParameters=false
validateQueryResults=false
warmUp=true
runBenchmark=true
runBenchmarkOnlineReplicationAndBackup=false
checkConformance=false

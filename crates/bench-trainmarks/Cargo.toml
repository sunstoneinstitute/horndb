[package]
name = "horndb-bench-trainmarks"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# Internal benchmark driver: runs the DataTreehouse "trainmarks" RDF benchmark
# (https://github.com/DataTreehouse/trainmarks) against HornDB's storage/WCOJ
# SPARQL backend (`HornBackend`). Driven by `scripts/bench/trainmarks.sh`.
# Mirrors the upstream measurement protocol (read/write Turtle + N-Triples,
# six SPARQL queries cold + best-of-3, per-operation timeout) and emits a
# results JSON in the upstream schema so it can drop into their report.
# Not part of the engine; not shipped.

[[bin]]
name = "bench-trainmarks"
path = "src/main.rs"

[features]
# E1 of HDB-86: A/B the process-wide allocator against the default system one.
# `parse` ships ~30M oxrdf terms allocated on parse threads and freed on the
# main thread; glibc malloc takes the owning arena's lock for every such
# cross-thread free. mimalloc and snmalloc both keep per-thread free lists and
# service remote frees without that lock. Off by default so the baseline is
# still measurable from the same tree; pick exactly one.
mimalloc = ["dep:mimalloc"]
snmalloc = ["dep:snmalloc-rs"]

[dependencies]
horndb-metrics.workspace = true
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
oxrdf = { workspace = true }
oxttl = { workspace = true }
horndb-sparql = { path = "../sparql", default-features = false }
horndb-storage = { path = "../storage" }
mimalloc = { version = "0.1", optional = true }
snmalloc-rs = { version = "0.3", optional = true }

[package]
name = "horndb-bench-trainmarks"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# Internal benchmark driver: runs the DataTreehouse "trainmarks" RDF benchmark
# (https://github.com/DataTreehouse/trainmarks) against HornDB's storage/WCOJ
# SPARQL backend (`HornBackend`). Driven by `scripts/bench/trainmarks.sh`.
# Mirrors the upstream measurement protocol (read/write Turtle + N-Triples,
# six SPARQL queries cold + best-of-3, per-operation timeout) and emits a
# results JSON in the upstream schema so it can drop into their report.
# Not part of the engine; not shipped.

[[bin]]
name = "bench-trainmarks"
path = "src/main.rs"

[features]
default = ["snmalloc"]
# HDB-86 E1: snmalloc as the process-wide allocator. `parse` frees ~30M oxrdf
# terms on the main thread that were allocated on parse threads, and glibc
# malloc takes the owning arena's lock for every such cross-thread free.
# snmalloc keeps per-thread free lists and services a remote free without it:
# measured -10.6% on `parse` and -6.3% end-to-end at trainmarks xlarge.
# Disabling this feature restores the system allocator, which is the revert
# path and the way to re-run the A/B.
snmalloc = ["dep:snmalloc-rs"]

[dependencies]
horndb-metrics.workspace = true
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
oxrdf = { workspace = true }
oxttl = { workspace = true }
horndb-sparql = { path = "../sparql", default-features = false }
horndb-storage = { path = "../storage" }
snmalloc-rs = { workspace = true, optional = true }

# HDB-91: incremental (non-empty store) bulk-load phase table.
[[bin]]
name = "incremental_load"
path = "src/bin/incremental_load.rs"

[package]
name = "horndb-sparql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["server", "reasoner", "snmalloc"]
server = ["dep:axum", "dep:tokio", "dep:tower", "dep:hyper", "dep:http-body", "dep:bytes", "dep:pin-project-lite", "dep:parking_lot"]
reasoner = ["dep:horndb-owlrl"]
# SPEC-05 GraphBLAS closure backend, reachable as `[reasoning].backend =
# "graphblas"`. Off by default: turning it on makes the build link
# SuiteSparse:GraphBLAS (cmake + pkg-config), which a plain
# `cargo build -p horndb-sparql` must not require. Without it, `serve` rejects
# `backend = "graphblas"` at startup naming this feature. The release image
# builds with it (see `Dockerfile`).
graphblas = ["reasoner", "horndb-owlrl/graphblas-backend"]
# HDB-86 E1: snmalloc as the process-wide allocator for this crate's binary.
# Measured on the trainmarks bulk load (hornbench, xlarge): -10.6% on the
# `parse` phase, -6.3% end-to-end, because a cross-thread free no longer takes
# the owning arena's lock. Default-on; disabling it restores the system
# allocator and is the revert path.
snmalloc = ["dep:snmalloc-rs"]

[dependencies]
snmalloc-rs = { workspace = true, optional = true }
# `sep-0006` enables spargebra's `GraphPattern::Lateral` variant. The
# workspace's oxigraph dependency activates it transitively elsewhere,
# so requesting it here keeps `-p horndb-sparql` matches exhaustive
# under all feature configurations.
#
# `sparql-12` enables RDF 1.2 triple-term `TermPattern::Triple` and
# transitively activates `oxrdf/rdf-12`. The SPARQL translator routes
# triple-term patterns at runtime through `SparqlConfig::rdf12`; the
# default config rejects them so SPARQL 1.1 clients keep their semantics.
spargebra = { workspace = true, features = ["sep-0006", "sparql-12"] }
oxrdf = { workspace = true }
oxiri = { workspace = true }
sparesults = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
# SPARQL REGEX/REPLACE builtins (`exec::runtime::compile_regex`).
regex = { workspace = true }
# FxHash for the runtime's hot hash tables (join index, GROUP BY, DISTINCT);
# matches owlrl/closure. See `exec::runtime`.
rustc-hash = "2"
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
pin-project-lite = { workspace = true, optional = true }
# The `AppState.store` lock (HDB-114): `std::sync::RwLock` poisons on a panic
# while a guard is held, so every later request panics too until restart.
# parking_lot::RwLock never poisons; already a workspace dep (horndb-storage).
parking_lot = { workspace = true, optional = true }
# Used only by the `serve` binary (gated on the `server` feature). Kept
# non-optional for simplicity — they are small, pure-Rust deps and the
# library code does not reference them.
oxttl = { workspace = true }
clap = { workspace = true }
horndb-owlrl = { path = "../owlrl", optional = true }
horndb-storage = { path = "../storage" }
horndb-wcoj = { path = "../wcoj" }
horndb-metrics.workspace = true
horndb-simd.workspace = true
# SPEC-26 layered configuration. Mostly consumed by the `serve` binary; the
# library also references it for one type-level bridge (`impl
# From<horndb_config::DefaultGraph> for DefaultGraphMode`, `src/lib.rs`),
# which keeps `horndb-config` free of a reverse dependency on this crate.
horndb-config = { workspace = true }
arrow = { workspace = true }

[[bin]]
name = "serve"
path = "src/bin/serve.rs"
# The server (axum/tokio) lives behind the `server` feature; the binary
# cannot build without it.
required-features = ["server"]

[dev-dependencies]
pretty_assertions = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
# `serve` binary integration tests (config-file/env/CLI bind precedence,
# startup-fatal validation).
assert_cmd = { workspace = true }
# Property-based differential for the SPARQL-level change-feed replay
# (`tests/update_feed_replay.rs`), the frontend analog of the storage crate's
# `feed_replay.rs`.
proptest = { workspace = true }
